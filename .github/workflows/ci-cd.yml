name: CI/CD Pipeline - TicketMEI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changes per Service
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            catalog:
              - 'catalog/**'
            order:
              - 'order/**'
            notification:
              - 'notification/**'

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Repository Name in Lowercase
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  update-manifests:
    needs: [detect-changes, build-and-push]
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Only Changed Services in Kubernetes Manifests
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          mkdir -p k8s
          echo "Serviços alterados: $CHANGED_SERVICES"

          for svc in $(echo "$CHANGED_SERVICES" | jq -r '.[]'); do
            MANIFEST="k8s/${svc}-deployment.yaml"
            if [ -f "$MANIFEST" ]; then
              echo "Atualizando tag de $svc para ${{ github.sha }} em $MANIFEST"
              sed -i -E "s|(image: ghcr.io/[^:]+/${svc}:).*|\1${{ github.sha }}|" "$MANIFEST"
            fi
          done

      - name: Commit and Push Updated Manifests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/ || true
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos manifestos para commitar."
          else
            git commit -m "chore(gitops): update image tags for ${{ needs.detect-changes.outputs.services }} to ${{ github.sha }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi