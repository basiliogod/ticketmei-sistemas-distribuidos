apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: grupo09
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api-gateway
        image: ghcr.io/basiliogod/ticketmei-sistemas-distribuidos/api-gateway:2a1c4b2138dede1f5dba0fe98e7879672059455a
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: CATALOG_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: CATALOG_URL
        - name: ORDER_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: ORDER_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: REDIS_URL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: grupo09
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: metrics
    port: 8000
    targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-monitor
  namespace: grupo09
  labels:
    release: kube-prometheus-stack-prometheus
spec:
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
  - port: metrics
    path: /metrics
    interval: 60s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-gateway
  namespace: grupo09
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000