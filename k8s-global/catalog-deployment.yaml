apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: grupo09
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: catalog
        image: ghcr.io/basiliogod/ticketmei-sistemas-distribuidos/catalog:a1ab6e6cec56e7ad67fd9c2ab309a48fe42cd167
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: grupo09
  labels:
    app: catalog
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
  - name: metrics
    port: 8001
    targetPort: 8001
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalog-monitor
  namespace: grupo09
  labels:
    release: kube-prometheus-stack-prometheus
spec:
  selector:
    matchLabels:
      app: catalog
  endpoints:
  - port: metrics
    path: /metrics
    interval: 60s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-catalog
  namespace: grupo09
spec:
  podSelector:
    matchLabels:
      app: catalog
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8001