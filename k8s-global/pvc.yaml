apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-shared-storage
  namespace: grupo09
  annotations:
    # Prevents ArgoCD from deleting your PVC (and wiping your data) if this file is removed from Git
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
