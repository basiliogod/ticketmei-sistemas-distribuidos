apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: grupo09
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: order
        image: ghcr.io/basiliogod/ticketmei-sistemas-distribuidos/order:d17185e7cf5f896e76077f21158f464a1f2fc027
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          value: "8002"
        - name: PAYMENT_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: PAYMENT_URL
        - name: RABBITMQ_HOST
          value: "rabbitmq.rabbitmq-system.svc.cluster.local"
        - name: RABBITMQ_VHOST
          value: "/grupo09"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: grupo09-user-user-credentials
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grupo09-user-user-credentials
              key: password
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: grupo09
  labels:
    app: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
  - name: metrics
    port: 8002
    targetPort: 8002
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-monitor
  namespace: grupo09
  labels:
    release: kube-prometheus-stack-prometheus
spec:
  selector:
    matchLabels:
      app: order
  endpoints:
  - port: metrics
    path: /metrics
    interval: 60s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-order
  namespace: grupo09
spec:
  podSelector:
    matchLabels:
      app: order
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8002