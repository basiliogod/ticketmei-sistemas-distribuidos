apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: ghcr.io/basiliogod/ticketmei-sistemas-distribuidos/catalog:a1ab6e6cec56e7ad67fd9c2ab309a48fe42cd167
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ticketmei
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
  - port: 8001
    targetPort: 8001
