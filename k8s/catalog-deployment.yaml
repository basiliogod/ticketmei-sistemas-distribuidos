apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: ghcr.io/basiliogod/ticketmei-sistemas-distribuidos/catalog:8afdc316cafbf71ba91c9d0ce862f7b9e62a141c
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ticketmei
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
  - port: 8001
    targetPort: 8001
