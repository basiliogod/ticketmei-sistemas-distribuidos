apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/basiliogod/ticketmei-sistemas-distribuidos/api-gateway:a1ab6e6cec56e7ad67fd9c2ab309a48fe42cd167
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: CATALOG_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: CATALOG_URL
        - name: ORDER_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: ORDER_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: REDIS_URL   
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi         
      initContainers:
      - name: wait-for-catalog
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z catalog 8001; do echo waiting for catalog; sleep 1; done;']
      - name: wait-for-order
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z order 8002; do echo waiting for order; sleep 1; done;']
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ticketmei
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
