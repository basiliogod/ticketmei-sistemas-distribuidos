apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
      - name: order
        image: ghcr.io/basiliogod/ticketmei-sistemas-distribuidos/order:a1ab6e6cec56e7ad67fd9c2ab309a48fe42cd167
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          value: "8002"
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: service-env
              key: RABBITMQ_URL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 1; done;']
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ticketmei
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
  - port: 8002
    targetPort: 8002
